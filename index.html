<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 학습장</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f8fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단어집">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<style>
:root{color-scheme:light;--bg:#f7f8fa;--card:#fff;--ink:#1a1d23;--sub:#6b7280;--mut:#9aa1ab;
--line:#e5e7eb;--blue:#3b82f6;--green:#10b981;--red:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:18px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13px;margin-top:3px}
.tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
select,input[type=search]{border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
input[type=search]{width:170px}
.chip{border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;cursor:pointer;user-select:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.spk.nomp3,.spk2.nomp3{opacity:.3}
#asrc{cursor:default}
.count{font-size:12px;color:var(--sub);margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin-bottom:10px}
.hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.w{font-size:19px;font-weight:700;letter-spacing:-.3px}
.ipa{color:var(--sub);font-size:13px}
.kor{color:var(--sub);font-size:13px}
/* ⭐ 탭 타겟 (2026-09-19) — 28x28 이었다. 폰에서 「너무 작고 애매하다」는 지적을 받았다.
   애플·구글 권장 최소는 44x44 다. 색도 회색 테두리+회색 글자라 눌러도 되는 것으로 안 읽혔다. */
.spk{border:1px solid #cfe0fb;background:#eef4ff;border-radius:12px;width:44px;height:44px;
  cursor:pointer;font-size:15px;line-height:1;color:var(--blue);padding:0;flex:none;
  -webkit-tap-highlight-color:transparent;transition:transform .08s,background .12s}
.spk:hover{background:#dfeaff}
.spk:active{transform:scale(.92);background:#cfe0fb}
/* 재생 중인 버튼을 표시한다 — 폰에서는 상태표시줄(#astat)이 눈에 안 들어온다 */
.spk.playing,.spk2.playing{background:var(--blue);border-color:var(--blue);color:#fff}
/* 예문의 ▶ 는 문장 끝에 붙어 있었다. 오른쪽으로 띄워 글과 버튼의 경계를 분명히 한다 */
.ex .spk{float:right;margin-left:10px;margin-top:-2px}
.ex::after{content:"";display:block;clear:both}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:5px;font-weight:600;margin-left:auto}
.t단어{background:#e7f0fa;color:#1e4e8c}.t숙어{background:#fff2cc;color:#8a6100}
.t슬랭{background:#fce4ec;color:#a01048}.t스몰토크{background:#e8f5e9;color:#1b6b2e}
.mean{font-size:15px;margin-top:7px}
.ex{margin-top:9px;padding-top:9px;border-top:1px solid #f1f2f4;font-size:14px}
.exk{color:var(--sub);font-size:13px;margin-top:2px}
.meta{margin-top:8px;font-size:11px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#dfe3e8;margin-right:2px}
.dot.f{background:var(--green)}
/* ⚠️ 예전에는 filter:blur 였다. 그런데 `.ex` 안에 ▶ 버튼이 들어 있어서 **버튼까지 흐려졌다.**
   filter 는 렌더된 하위 전체에 걸려 자식이 되돌릴 수 없다 -> 글자에만 걸리는 방식으로 바꾼다. */
.hide .mean,.hide .ex,.hide .ex .exk{color:transparent;text-shadow:0 0 9px rgba(26,29,35,.5);
  cursor:pointer;user-select:none}
.hide .ex .spk{text-shadow:none}
.hide .mean.show,.hide .ex.show{color:var(--ink);text-shadow:none}
.hide .ex.show .exk{color:var(--sub);text-shadow:none}
.due{color:var(--red);font-weight:600}
.dia{margin-top:9px;border-top:1px solid #f1f2f4;padding-top:8px}
.dtog{background:none;border:none;color:var(--blue);font-size:12px;cursor:pointer;padding:0;font-family:inherit;font-weight:600}
.dbody{display:none;margin-top:7px;background:#fafbfc;border-radius:9px;padding:10px 12px}
.dbody.open{display:block}
.turn{margin-bottom:7px;font-size:13.5px}
.turn:last-child{margin-bottom:0}
.tspk{color:var(--mut);font-size:11px;font-weight:600;margin-right:5px}
.tko{color:var(--sub);font-size:12.5px;margin-top:1px}
.extra{background:#fffdf5;border-color:#f0e2b8}
.empty{padding:34px;text-align:center;color:var(--sub);font-size:14px}
.bar{position:sticky;top:0;background:var(--bg);padding-bottom:8px;z-index:5}

/* ⭐⭐ 폰 가독성 (2026-09-19) — 실제 폰에서 보고 고친 것들.
   ⚠️ input 의 font-size 가 16px 미만이면 **사파리가 탭할 때 페이지를 확대한다.** 그게 제일 거슬렸다. */
.spk2{border:1px solid #cfe0fb;background:#eef4ff;border-radius:999px;width:34px;height:34px;
  cursor:pointer;color:var(--blue);font-size:12px;line-height:1;padding:0;margin-left:6px;flex:none;
  vertical-align:middle;-webkit-tap-highlight-color:transparent}
.spk2:active{transform:scale(.92)}
.dtog{min-height:38px;display:inline-flex;align-items:center;font-size:13.5px}
input[type=search],select{font-size:16px;padding:9px 12px}
.chip{padding:9px 14px;font-size:13px;-webkit-tap-highlight-color:transparent}
.chip:active{transform:scale(.96)}
#cats{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}

@media (max-width:480px){
  body{padding:14px 12px}
  h1{font-size:22px}
  .sub{font-size:13.5px;line-height:1.5}
  .card{padding:15px 14px;border-radius:15px;margin-bottom:12px}
  .w{font-size:22px}
  .mean{font-size:17px;margin-top:9px}
  .ex{font-size:16px;margin-top:11px;padding-top:11px}
  .exk{font-size:14.5px;margin-top:4px}
  .ipa,.kor{font-size:13.5px}
  .turn{font-size:15px;margin-bottom:10px}
  .tko{font-size:13.5px;margin-top:3px}
  .meta{font-size:12.5px;gap:6px 12px;margin-top:11px}
  .tag{font-size:11px;padding:3px 9px}
  /* 필터가 네 줄까지 늘어났다 — sticky 바가 화면을 너무 먹는다. 세 줄로 눌러 담는다:
     ① 세션 선택 + 뜻 가리기  ② 검색 + 속도  ③ 분류(가로 스크롤) */
  .tools{gap:6px;margin:12px 0 8px}
  #grp{flex:1 1 56%;min-width:0;order:1}
  #mask{order:2;flex:0 0 auto}
  input[type=search]{flex:1 1 62%;width:auto;min-width:0;order:3}
  #spd{order:4;flex:0 0 auto}
  #cats{flex:1 1 100%;order:5;padding-bottom:2px}
  /* 「🎧 Ava 음성 640」은 정보성일 뿐이고 한 줄을 통째로 먹는다. 음성이 있는지는 ▶ 색으로 안다 */
  #asrc{display:none}
  .count{font-size:12.5px}
  /* 제목이 길면(rush hour) 분류 태그가 다음 줄로 밀려 내려갔다 -> 카드 우상단에 고정한다 */
  .card{position:relative}
  .hd{padding-right:56px;align-items:center}
  .tag{position:absolute;top:15px;right:14px;margin-left:0}
  .meta{gap:4px 10px}
}
</style></head><body><div class="wrap">
<h1>영어 학습장</h1>
<div class="sub" id="sub"></div>
<div class="tools" style="margin:8px 0 0">
  <span class="chip" id="swver" title="서비스워커가 실제로 쓰고 있는 캐시 이름입니다">● …</span>
  <span class="chip" id="offl" title="음성을 미리 받아 두면 비행기 모드에서도 들립니다">오프라인 준비 …</span>
</div>
<div class="bar">
<div class="tools">
  <select id="grp"></select>
  <span id="cats"></span>
  <input type="search" id="q" placeholder="단어·뜻 검색">
  <span class="chip" id="mask">뜻 가리기</span>
  <span class="chip" id="asrc"></span>
  <span class="chip" id="spd" title="재생 속도 (클릭해서 변경)">1.0x</span>
</div>
<div class="count" id="cnt"></div>
<div class="count" id="astat" style="font-size:11px"></div>
</div>
<div id="list"></div>
</div>
<script>

3", "Same, honestly. We should do something fun.": "6a0abe2f5285.mp3", "You've been quiet all week. What's been bugging you?": "8d9d0a3321d2.mp3", "It's the work thing. I'll get over it.": "0e396bd294be.mp3", "Bangkok, then Chiang Mai next week.": "681196a5d19e.mp3", "Enjoy your trip.": "09c8faba882a.mp3", "Straight back, on your left.": "e2bf504c2765.mp3", "Got it, thanks.": "f25c7d9d984d.mp3", "Born and raised. Why, are you lost?": "a096be7162ed.mp3", "A little. I'm looking for the night market.": "11bab28657d2.mp3", "Just tired. Nothing serious.": "513ecb3bf564.mp3", "Just a heads-up — the road to the airport is packed right now.": "153602f165e5.mp3", "Thanks for the heads-up. I'll leave earlier.": "3d8ee9015066.mp3", "What amenities does the place have?": "fa8eb16c9f0c.mp3", "A gym, a laundry room, and free breakfast.": "dfd4a635276f.mp3", "Not bad for the price.": "d7f88015a4d4.mp3", "You okay? You've been sighing all morning.": "d7487aa7a22b.mp3", "I'm a little annoyed. He canceled on me again.": "9178f10b6bd6.mp3", "Again? That's the third time.": "e0160155d494.mp3", "Did you see her fit at the party?": "21e77f432601.mp3", "No notes, honestly.": "dd2fe1539ad0.mp3", "Why is he wearing sunglasses inside?": "3021e63f205b.mp3", "Aura farming, obviously.": "7531d00915f7.mp3", "It's kind of working, though.": "1f1871c207ae.mp3", "We're doing a picnic on Sunday. You in?": "c11b41897f75.mp3", "Awesome. Bring something to share.": "34697fe29e9b.mp3", "I'm out of immigration. Where should I meet you?": "30fb8e8509f0.mp3", "Could you take one more project?": "72ff1642adc7.mp3", "Understood. Let's revisit next month.": "43665dc7dbf0.mp3", "Right? It was on the clearance rack.": "fb4e7e346ae6.mp3", "You ate with that one.": "7fe12f225598.mp3", "Meet at 7?": "d6752b4d96a4.mp3", "Bet.": "cdda5b8175aa.mp3", "Don't be late this time.": "24b7c566f530.mp3", "Is the station far?": "b3b4338a3777.mp3", "Oh, I can walk that.": "d034bd603007.mp3", "Thank you. Gate 24, boarding starts at 3:40.": "9d8dc535cc7e.mp3", "Should I call and reserve?": "45f8b3ef6b35.mp3", "I already booked a table for two at 7.": "7775e054acc0.mp3", "You're on top of things today.": "e3d47a378158.mp3", "Can I help you find something?": "979bf67b3938.mp3", "I'm just going to browse for a bit, thanks.": "74b611524060.mp3", "Take your time.": "06d267d31694.mp3", "Did you hear the concert got canceled?": "fc0e4b743efd.mp3", "I'm so bummed. I'd been waiting for months.": "b6135571cf1a.mp3", "They said they'd reschedule, at least.": "953fd883cdc3.mp3", "How is it?": "15230348d4d5.mp3", "This tteokbokki is bussin'. Try it.": "a631de877525.mp3", "Oh wow. Okay, we're coming back here.": "606ac68b7527.mp3", "Do you want to keep going?": "e9cd1b994c30.mp3", "Agreed. We'll pick it up tomorrow morning.": "738a580f1499.mp3", "It's been what, six months?": "a02535e15a24.mp3", "At least. We should catch up sometime soon.": "d9a52a3883a9.mp3", "How about dinner next Thursday?": "77e99e2eaf45.mp3", "Hi, what time can we check in?": "4feb222e47b1.mp3", "Check-in starts at three, but you can leave your bags here.": "8358d5f68a6f.mp3", "That'd be great, thank you.": "55fca6280c1e.mp3", "Any good places around here?": "f33902ace5a9.mp3", "You should check out that new bookstore. It has a café inside.": "6a701ed21c9b.mp3", "Let's check it out after lunch.": "3e74c458434d.mp3", "The photo looked nice, honestly.": "79e25de5ce04.mp3", "Returning it tomorrow then.": "2ef830a96321.mp3", "How did you know that rate was fake?": "74abbfe4701e.mp3", "I clocked it the second I saw the fine print.": "e48bd5733d93.mp3", "Okay, sharp eye.": "301c502f5c29.mp3", "This is taking forever.": "a8ab54b5530d.mp3", "I came up with a better way to do it. Want to see?": "1c3583df2e8b.mp3", "Please. Anything faster.": "1f87d9b92c2c.mp3", "Did you say anything about the noise?": "a8bba38ff580.mp3", "I hate to complain, but I had to. It was every night.": "27b9f39d8dc2.mp3", "You were right to complain.": "02a0485a7d5a.mp3", "The exam is in two hours.": "1eff4097e83d.mp3", "The train leaves in four minutes.": "20bc486950cf.mp3", "Read the summary at least. Something is better than nothing.": "55344e6684d1.mp3", "Then run. I'll grab your bag.": "460e11daa163.mp3", "We're doing dinner at 7. You free?": "e0e1d9a0c857.mp3", "Great. I'll send the address.": "285c2486499e.mp3", "Sorry if I snapped earlier.": "1924ee911c72.mp3", "It's fine. Rough night?": "8861d127cac4.mp3", "Yeah. I get cranky when I don't sleep enough.": "109246c445aa.mp3", "You okay? You look done.": "d743526737da.mp3", "They lost my booking. I almost crashed out at the desk.": "63569617e12d.mp3", "Respect for staying calm.": "80b2160f1d13.mp3", "Should we go Saturday?": "2172a1bf4fbd.mp3", "It gets really crowded on weekends. Let's go Tuesday.": "fead6c7dde94.mp3", "Good point. I hate lines.": "c65182f6cc37.mp3", "How was the airport?": "9303993eb741.mp3", "Really? What for?": "6bc866470ab6.mp3", "They just wanted to check my bag. Took five minutes.": "77f0eca9c6fa.mp3", "When's the deadline again?": "3b6f7f66295f.mp3", "This Friday at noon.": "96633e3bb8ad.mp3", "Got it. I'll have it by then.": "f552d4aacc0c.mp3", "Are you here already?": "7e1d8ec3675d.mp3", "No, my flight got delayed. It's crowded at the gate and nobody knows what's going on.": "422cbd0536d7.mp3", "Ugh. Text me when you take off.": "e14a8960f1f8.mp3", "I booked the cheapest ticket with a nine-hour layover.": "0e95888863d7.mp3", "I'll sleep at the gate. It's fine.": "07343c73cddc.mp3", "We'll need a fifty-dollar deposit for the room.": "5fb6cb47d686.mp3", "Is the deposit refundable?": "c84683bcfcad.mp3", "Yes, we return it at checkout if there's no damage.": "4a43edd640c4.mp3", "Why are we going this way?": "2bd23e80c5a5.mp3", "Got it, thanks for explaining.": "64ee87222ede.mp3", "We do — ten percent with a student ID.": "91c23726ed60.mp3", "Perfect, here it is.": "7f05ae9800c5.mp3", "Sure. Rough numbers, or do you need it itemized?": "efd5848bf720.mp3", "Itemized, if you can. I have to show it to my manager.": "d693d7fee9d0.mp3", "Sure, do you have the receipt?": "97021777cfb7.mp3", "Right here.": "d2f4b9cb3860.mp3", "About thirty dollars, depending on traffic.": "cc8ffe848d20.mp3", "That works. Let's go.": "c197a57a9cfb.mp3", "I think the lock is faulty — it doesn't always catch.": "ef8cf53c301b.mp3", "That's a safety issue. Let me move you to another room.": "e204646361aa.mp3", "I'd appreciate that.": "9c8d1ba59d88.mp3", "Any reply from the client yet?": "69e589491eb8.mp3", "Nothing. I'm fed up with waiting.": "c1dbc586f2d2.mp3", "Give them one more day, then follow up.": "f62f1b6fba8a.mp3", "Still stuck on that file?": "1a8a9302ef77.mp3", "Yeah, I can't figure out why it won't open.": "7627fd5d7a8b.mp3", "Send it to me. I'll figure it out.": "f847aa1062ae.mp3", "Who made this playlist?": "a5cd10afd786.mp3", "I did. That playlist is fire, right?": "4cfb773d1ab4.mp3", "Send it to me right now.": "ad5bc19e9676.mp3", "How did it fit?": "d9ffb3b72111.mp3", "These jeans fit perfectly, actually.": "87b65d05923d.mp3", "Great, that's our last pair in that size.": "3dee6fb42942.mp3", "Did he really need to bring the camera to dinner?": "e7b96fea4387.mp3", "At least the photos are good.": "7c574db16283.mp3", "Why are you sighing at your phone?": "dcba523f2961.mp3", "I'm getting frustrated with this app. It keeps logging me out.": "86f74182faac.mp3", "Try deleting it and installing it again.": "02842cc73bb9.mp3", "Should I rent a car?": "c2b549782155.mp3", "No need. It's easy to get around by subway here.": "f9cf3f2b63a3.mp3", "Even at night?": "4d0c4b595183.mp3", "Until midnight, yeah.": "4c3dac557079.mp3", "This place has five stars everywhere.": "8d1aa7dec323.mp3", "That's glazing. Half those reviews are from the owner's friends.": "2e2a199759b1.mp3", "Sus.": "23e4daffbf63.mp3", "Is that really Jenny? I barely recognized her.": "be2ae2bc4782.mp3", "Good for her. She looks happy too.": "495d33897905.mp3", "How did the presentation go?": "cb38dfab08a2.mp3", "Told you it would land.": "f2dec8046286.mp3", "We have twenty minutes before it starts.": "f79840ec0473.mp3", "There's a place downstairs. My treat.": "6ddd631cf07d.mp3", "The movie starts at 8.": "a11c900eba66.mp3", "Yes please. Something quick though.": "7440d85d3c41.mp3", "What did you do on Saturday?": "8a6a8d86cdeb.mp3", "Nothing much. We just hung out at her place all day.": "a077654f5084.mp3", "Honestly, that sounds perfect.": "ebb7b9412cec.mp3", "Where are you now?": "54704fd8e4b0.mp3", "Cool, I'll be there in 15 minutes.": "e45df0f6e641.mp3", "Why is this coffee so good today?": "0f6cd7fc7bc4.mp3", "You're right. Same beans, different experience.": "5ae1c16d11d9.mp3", "Where do I turn?": "e8ee32a7e40c.mp3", "Left at the next one. Thank you!": "70b88dd5ee13.mp3", "Can you hear that? The noise from upstairs.": "2c5339f5491f.mp3", "Yeah, it's starting to irritate me.": "e3f9c1e1f669.mp3", "Should we say something to them?": "6eeb259b260a.mp3", "How do I look?": "253ae6a2b35a.mp3", "Okay, it's giving main character energy.": "ca111fdf00f9.mp3", "That's exactly what I was going for.": "99b67e204c64.mp3", "I can do five off. That's the best I can do.": "f94fdd691e54.mp3", "Deal.": "37b51411cfbe.mp3", "Six hours. Long enough to leave the airport, actually.": "c1e884701f5c.mp3", "Nice, you could grab some ramen.": "dd5b42005375.mp3", "There's water leaking under the sink.": "2b002892df57.mp3", "I'm so sorry. I'll send maintenance right up.": "8f74a8c272ce.mp3", "Thanks — it's been leaking since last night.": "084f719c3c29.mp3", "Can you make the deadline?": "35b0349f2124.mp3", "I'll do my best. I don't want to let you down again.": "16b44a0375af.mp3", "You won't. Just tell me early if it slips.": "c3b1761ae5fb.mp3", "How was Saturday?": "220c39b46a0f.mp3", "The party last night was lit. You missed out.": "a6093c051665.mp3", "Ugh. Tell me everything.": "95cb62e754f6.mp3", "Wanna grab dinner tonight?": "d9b09218e3b6.mp3", "Can't, I need to lock in this week.": "84f31f01e788.mp3", "Fair. Next week then.": "56bc5c886d57.mp3", "You okay taking the subway?": "34fb5f171d68.mp3", "Same. Let's just walk.": "477a550fa01b.mp3", "You don't seem excited about the trip.": "aedbe4487de6.mp3", "No, I'm lowkey excited. I just don't want to jinx it.": "4ca6b5023dde.mp3", "Fair. Two more weeks.": "b1dd6f904fe3.mp3", "You okay? You look wrecked.": "ca22b2a56c80.mp3", "Take a break, seriously.": "fda2d55bd096.mp3", "Everyone said that movie was amazing.": "b5bf7f68111d.mp3", "How was the rooftop bar?": "bb604d521b8a.mp3", "Honestly? It was kinda mid.": "e00935da03e6.mp3", "Thank you. I thought I was the only one.": "f82af0005d3a.mp3", "Good to know. We'll skip it.": "6649021c7f6e.mp3", "Did they accept your rate?": "15e3246ba18c.mp3", "Not yet. I'm still negotiating the rate with them.": "d4fd9477c687.mp3", "Don't go too low. Your work is worth it.": "050a74b154d4.mp3", "Better than the place in Rome?": "ffbb8c9a64f3.mp3", "No cap. I'd go back tomorrow.": "f4faed10e59e.mp3", "Is the elevator still out of order?": "a83bdcd3d200.mp3", "I'm afraid so. The part arrives tomorrow.": "7a1172a5a68b.mp3", "We're on the sixth floor, so that's rough.": "f1c5fd00db78.mp3", "You've been quiet all morning.": "25d1c547b160.mp3", "Honestly, I'm a bit overwhelmed. Everything landed on the same day.": "1fe335d07cb1.mp3", "Pick one thing and start there. The rest can wait.": "d8f411fa227b.mp3", "My flight lands at 8 in the morning.": "e669756a1624.mp3", "Sure. Text me when you land.": "5d2c37e2d0af.mp3", "What's the plan after we land?": "2877961e5fae.mp3", "Look at all these replies he left.": "54b68d5c5aaf.mp3", "Why is he so pressed over one comment?": "76ae97220c5e.mp3", "Right? Just scroll past it.": "0aeee78b62d4.mp3", "What do you think of this bag?": "6c0cf78d6463.mp3", "Cute, but it's a bit pricey.": "ca52c4d2d02f.mp3", "Yeah, let's keep looking.": "5122a8df9a69.mp3", "You've got three deadlines this week. How a const RKEY='esc_rate', STEPS=[0.75,0.9,1,1.15];
let RATE=parseFloat(localStorage.getItem(RKEY))||1;
function rlabel(){ return (RATE===1?'1.0':String(RATE))+'x'; }

/* ===== 재생: 미리 만들어둔 Ava mp3가 있으면 그걸, 없으면 브라우저 TTS ===== */
const AUD=DATA.aud||{};
const HASAUD=Object.keys(AUD).length>0;
let CURAUD=null;
/* mp3가 아직 없는 항목용 최소 폴백 (아티팩트 뷰어에선 소리가 나지 않음) */
function ttsSay(txt){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='en-US'; u.rate=RATE*0.96;
  speechSynthesis.speak(u);
}
/* 재생 경로가 둘이다. AUD[key] 의 생김새로 갈린다.
   - `data:` 로 시작  -> playEmbedded()  : base64 가 박힌 아티팩트용. 아티팩트 뷰어가 Audio
                                           엘리먼트(data:/blob:)를 차단하므로 Web Audio 로 푼다.
   - 그냥 파일 이름   -> playFile()      : audio/ 폴더의 mp3 를 Audio 엘리먼트로 재생. 로컬·PWA 용.
   ⚠️ 2026-09-19 까지 playFile 은 **정의가 없었다.** 실제로 쓰는 것이 cards(base64)뿐이라
      이 경로가 한 번도 실행된 적이 없었고, 주석만 「그렇게 한다」고 적혀 있었다. 폰 단어집 PWA 가
      쓰는 것이 바로 이 경로라 구현했다. */
let ACTX=null, ANODE=null;
const BUFS={};
function stopAll(){
  if(CURAUD){ try{ CURAUD.pause(); }catch(e){} CURAUD=null; }
  if(ANODE){ try{ ANODE.stop(); }catch(e){} ANODE=null; }
  if(window.speechSynthesis) speechSynthesis.cancel();
}
function b64ToBytes(b64){
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}
function stat(msg,bad){
  const el=document.getElementById('astat');
  if(!el)return;
  el.textContent=msg;
  el.style.color = bad ? '#ef4444' : '#9aa1ab';
  el.title = msg;
}
async function playEmbedded(key,dataUrl,txt){
  let step='시작';
  try{
    step='AudioContext 생성';
    if(!ACTX){
      const C=window.AudioContext||window.webkitAudioContext;
      if(!C) throw new Error('AudioContext 미지원');
      ACTX=new C();
    }
    step='resume (state='+ACTX.state+')';
    if(ACTX.state!=='running') await ACTX.resume();
    if(ACTX.state!=='running') throw new Error('컨텍스트가 '+ACTX.state+' 상태');

    step='base64 디코드';
    let buf=BUFS[key];
    if(!buf){
      const b64=dataUrl.slice(dataUrl.indexOf(',')+1);
      const bytes=b64ToBytes(b64);
      if(!bytes.length) throw new Error('빈 오디오 데이터');
      step='mp3 디코드 ('+bytes.length+' bytes)';
      buf=await ACTX.decodeAudioData(bytes.buffer);
      BUFS[key]=buf;
    }
    step='재생';
    stopAll();
    const s2=ACTX.createBufferSource();
    s2.buffer=buf;
    s2.playbackRate.value=RATE;
    s2.connect(ACTX.destination);
    s2.onended=function(){ if(ANODE===s2) ANODE=null; clearPlaying(); };
    s2.start();
    ANODE=s2;
    stat('재생 중 · '+key.slice(0,28)+' ('+buf.duration.toFixed(1)+'초)',false);
  }catch(e){
    stat('재생 실패 ['+step+'] '+(e&&e.name?e.name+': ':'')+(e&&e.message?e.message:e),true);
    ttsSay(txt);
  }
}
/* audio/ 의 mp3 를 Audio 엘리먼트로 재생한다.
   ⚠️ iOS 는 **첫 재생이 사용자 제스처 안에서** 일어나야 한다. say() 는 click 핸들러에서 불리므로
      .play() 앞에 await 를 두지 않는다. 하나라도 끼면 제스처가 끊겨 조용히 실패한다.
   ⚠️ 실패 경로가 둘(onerror · play() 거절)이라 **둘 다 터지면 폴백이 두 번 발화한다.**
      2026-09-18 의 음성 이중 재생(decodeAudioData 콜백+Promise)과 같은 종류다 -> 한 번 가드. */
const AUDDIR='audio/';
function playFile(file,txt){
  const a=new Audio(AUDDIR+file);
  let done=false;
  function fail(where,e){
    if(done)return; done=true;
    if(CURAUD===a) CURAUD=null;
    clearPlaying();
    stat('재생 실패 ['+where+'] '+(e&&e.name?e.name+': ':'')+((e&&e.message)||AUDDIR+file),true);
    ttsSay(txt);
  }
  try{
    stopAll();
    a.playbackRate=RATE;
    a.preload='auto';
    a.onended=function(){ if(CURAUD===a) CURAUD=null; clearPlaying(); };
    a.onerror=function(){ fail('파일'); };
    CURAUD=a;
    const p=a.play();
    if(p&&p.catch) p.catch(function(e){ fail('play',e); });
    stat('재생 중 · '+String(txt).slice(0,28),false);
  }catch(e){ fail('시작',e); }
}
/* 어느 버튼을 눌렀는지 화면에 남긴다. 폰에서는 #astat 상태표시줄이 눈에 안 들어온다.
   ⚠️ 재생 길이를 모르므로 시간으로 끄지 않고 **다음 클릭·정지·끝남**에 끈다. */
let PLAYBTN=null;
function markPlaying(b){
  if(PLAYBTN) PLAYBTN.classList.remove('playing');
  PLAYBTN=b||null;
  if(PLAYBTN) PLAYBTN.classList.add('playing');
}
function clearPlaying(){ markPlaying(null); }
function say(t){
  const key=String(t).trim();
  const txt=key.replace(/\s+/g,' ');
  const file=AUD[key];
  if(!file){ stopAll(); return ttsSay(txt); }
  if(file.slice(0,5)==='data:') return playEmbedded(key,file,txt);
  playFile(file,txt);
}

/* ===== PWA: 서비스워커 등록 · 캐시 버전 표시 · 음성 선캐시 ===== */
const CACHEVER='english-v11';
(function(){
  const ver=document.getElementById('swver'), off=document.getElementById('offl');
  function vtext(t,bad){ if(!ver)return; ver.textContent=t; ver.classList.toggle('on',!bad); }

  /* ⭐ 버전이 어긋나면 **빠져나올 길**을 준다 (2026-09-19 실측으로 추가).
     SW 가 v10 인데 화면이 v8 캐시본인 상태를 실제로 만났다. 칩이 알려주기는 했지만
     홈 화면 앱에는 주소창도, 당겨서 새로고침도 없어서 사용자가 할 수 있는 게 없었다.
     ⚠️ 캐시를 지우지 않는다 — 지웠다가 네트워크가 안 되면 오프라인에서 앱이 아예 안 열린다.
        대신 index.html 만 network 로 다시 받아(서비스워커가 캐시에 갱신해 준다) 새로고침한다. */
  let freshening=false;
  async function freshen(){
    if(freshening)return; freshening=true;
    if(ver) ver.textContent='새 판 받는 중…';
    try{ if(navigator.onLine) await fetch('index.html',{cache:'reload'}); }catch(e){}
    location.reload();
  }
  function offerFreshen(live){
    vtext('⚠️ 새 판 있음 ('+live+') · 눌러서 새로고침', true);
    if(ver){ ver.style.cursor='pointer'; ver.onclick=freshen; }
    /* 온라인이면 한 번은 알아서 받아 온다. 세션당 1회로 묶어 무한 새로고침을 막는다. */
    let done=false;
    try{ done = sessionStorage.getItem('eng:freshen')==='1'; sessionStorage.setItem('eng:freshen','1'); }
    catch(e){ done=true; }
    if(!done && navigator.onLine) freshen();
  }
  if(!('serviceWorker' in navigator)){
    vtext('● SW 미지원',true);
    if(off){ off.textContent='오프라인 불가'; }
    return;
  }
  /* ⚠️ 화면에 박힌 버전이 아니라 **서비스워커가 실제로 쓰는** 버전을 띄운다.
     둘이 다르면 「새 판이 아직 안 잡혔다」는 뜻이고, 그게 바로 눈으로 봐야 하는 것이다. */
  function askVersion(sw){
    if(!sw){ vtext('● '+CACHEVER+' (SW 대기)',true); return; }
    try{
      const ch=new MessageChannel();
      ch.port1.onmessage=function(e){
        const live=(e.data&&e.data.cache)||'?';
        if(live===CACHEVER){ vtext('● '+live,false); return; }
        offerFreshen(live);            /* 화면이 낡았다 — 알리기만 하지 말고 길을 준다 */
      };
      sw.postMessage('version',[ch.port2]);
    }catch(e){ vtext('● '+CACHEVER,true); }
  }
  navigator.serviceWorker.register('sw.js').then(function(reg){
    askVersion(navigator.serviceWorker.controller || reg.active);
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      askVersion(navigator.serviceWorker.controller);
    });
    navigator.serviceWorker.ready.then(function(r){ precache(); askVersion(navigator.serviceWorker.controller||r.active); });
  }).catch(function(e){ vtext('● 등록 실패: '+(e&&e.message||e),true); });

  /* 음성을 미리 받아 둔다. 안 받아 두면 비행기 모드에서 **버튼은 있는데 안 들린다** —
     이 프로젝트에서 제일 많이 데인 증상이다. */
  let running=false;
  async function precache(){
    if(running||!off)return; running=true;
    const files=[...new Set(Object.values(AUD))].filter(f=>f&&f.slice(0,5)!=='data:');
    if(!files.length){ off.textContent='음성 없음'; return; }
    let c;
    try{ c=await caches.open('english-audio'); }   /* ⚠️ sw.js 의 AUDIO 와 같은 이름이어야 한다 */
    catch(e){ off.textContent='캐시 열기 실패'; return; }
    let ok=0, miss=0;
    for(let i=0;i<files.length;i+=24){
      await Promise.all(files.slice(i,i+24).map(async function(f){
        const u='audio/'+f;
        try{
          if(await c.match(u)){ ok++; return; }
          const r=await fetch(u);
          if(r&&r.ok){ await c.put(u,r); ok++; } else miss++;
        }catch(e){ miss++; }
      }));
      off.textContent='오프라인 준비 '+Math.round((ok+miss)/files.length*100)+'%';
    }
    off.textContent = miss ? ('오프라인 준비 '+ok+'/'+files.length+' ⚠️'+miss+' 실패')
                           : ('오프라인 준비 완료 · 음성 '+ok);
    off.classList.toggle('on', !miss);
  }
})();
</script></body></html>
